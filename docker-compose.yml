services:
  api:
    build: ./apps/api
    ports: ["8000:8000"]
    environment:
      RANAU_ADMIN_TOKEN: ${RANAU_ADMIN_TOKEN:-ganti-token-ini}
      RANAU_CORS: ${RANAU_CORS:-http://localhost:3000}
      RANAU_DB: /app/data/ranau.db
    volumes: ["./data:/app/data"]
  web:
    build:
      context: ./apps/web
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8000}
    ports: ["3000:3000"]
    depends_on: [api]
